<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music - Zack Zimny</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="public/favicon.ico" />
  </head>
  <body>
    <div class="main-container">
      <div class="titlebar">
        <img src="/tshirt.jpeg" class="tshirt-img" alt="tshirt" />
        <div class="name-titlebar">
          <div class="name-titlebar-left">Zack</div>
          <div class="name-titlebar-right">Zimny</div>
        </div>
        <a href="/" class="title-link">Home</a>
        <a href="/friends.html" class="title-link">Friends :)</a>
        <a href="/photos.html" class="title-link">Photos</a>
        <a href="/projects.html" class="title-link">Projects</a>
        <a href="/blog.html" class="title-link">Blog</a>
        <a href="/music.html" class="title-link active-nav">Music</a>
        <a href="/chat.html" class="title-link">Chat</a>
      </div>
      <div class="right-main-container">
        <div style="max-width: 750px; width: 100%">
          <h1>Music</h1>
          <div class="kanm-player">
            <button id="kanm-play-button" class="play-button">
              <span class="play-icon">▶</span>
              <span class="play-text">Play</span>
            </button>
            <div class="kanm-info">
              <a href="https://kanm.org" class="kanm-title">KANM Student Radio</span>
              <span class="kanm-description">Live from Texas A&M</span>
            </div>
            <audio id="kanm-audio">
              <source src="https://icecast.kanm.org/listen" type="audio/mpeg" />
              Your browser does not support the audio element.
            </audio>
          </div>
          <p>
            Listen to my friends at
            <a href="https://kanm.org" target="_blank">KANM</a>, the college
            station of <span style="color: var(--tamu-maroon)">College Station</span>.
          </p>

        </div>
      </div>
    </div>
    <script type="module" src="/src/music.ts"></script>
  </body>
</html>
